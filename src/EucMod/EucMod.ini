; EucMod settings. Edit, then press Insert in-game to reload scripts.
; This file is copied to GTA V\scripts on every build - edit the copy in the repo.

[Keys]
; Spawn / remove the EUC. Ride/dismount uses the normal Enter key (F / Y on controller).
SpawnKey = F7

[Model]
; Invisible anchor prop the rider and model attach to. Its origin is the ground contact point.
RootModel = prop_roadcone02a
; Comma-separated, first existing model wins. Our own euc model will go first once exported.
VisualModels = euc_offroad, prop_rub_tyre_01
; Extra offset (x right, y forward, z up, metres). Height is automatic: the model's lowest point sits on the ground.
VisualOffset = 0, 0, 0

[ModelRotations]
; Per-model rotation fix-up: pitch, roll, yaw in degrees. Models not listed use 0, 0, 0.
prop_rub_tyre_01 = 0, 0, 90

[Rider]
; Height of the ped's origin above the ground while standing on the pedals.
RiderHeight = 1.25
AnimDict = anim@heists@heist_corona@single_team
AnimName = single_team_loop_boss

[Ride]
MaxSpeedKmh = 220
MaxReverseKmh = 15
; m/s^2
Accel = 9.0
Brake = 9
CoastDecel = 3
; deg/s when nearly stopped; turn rate halves at TurnFalloff m/s
TurnRateLow = 170
TurnFalloff = 20
; Tilt-back starts at this fraction of max speed
TiltbackRatio = 2.0 ; disabled
; 1 = pushing into tilt-back for CutoutSeconds throws you off
CutoutEnabled = 1
CutoutSeconds = 1.5
CrashSpeedKmh = 18
; m/s vertical
HardLandingSpeed = 9
StepHeight = 0.4
RangeKm = 40
; fraction of a full battery per second while parked
ParkedChargePerSecond = 0.005

[Visual]
MaxLeanDeg = 36
; Turn lean is physical: tan(lean) = speed * turn rate / g, capped at MaxRollDeg
MaxRollDeg = 40
; How quickly the lean follows the turn (higher = snappier)
LeanResponse = 5
; Set to -1 if the rider leans out of turns instead of into them
RollSign = 1
TiltbackDeg = 7
ShowHud = 1

[Radio]
; Speaker = music plays from the wheel in 3D (like a Bluetooth speaker).
; Headphones = plays everywhere at full volume, only while riding (fallback if Speaker is silent).
Mode = Headphones
ToggleKey = R
; [ and ] keys
PrevKey = OemOpenBrackets
NextKey = OemCloseBrackets
; 1 = speaker keeps playing when you step off
PlayWhenParked = 1
; station index to start on (0 = first unlocked station)
StartStation = 0
; Speaker mode only: the game sound source linked to the wheel. The default boombox emitter is
; silent in Story Mode on this game build, which is why Mode is set to Headphones.
Emitter = SE_Script_Placed_Prop_Emitter_Boombox
